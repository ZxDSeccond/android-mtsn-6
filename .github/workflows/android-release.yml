name: Build Android Release APK/AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME"
          cd "$RUNNER_TEMP"

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip -d "$ANDROID_HOME"

          if [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            echo "cmdline-tools exists"
          else
            if [ -d "$ANDROID_HOME/cmdline-tools-latest/bin" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools-latest" "$ANDROID_HOME/cmdline-tools/latest"
            else
              echo "SDK structure not found"
              find "$ANDROID_HOME" -maxdepth 5 -type d | head -50
              exit 1
            fi
          fi

          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android
        run: |
          npx cap sync android

      - name: Decode keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Create signing config
        shell: bash
        run: |
          cd android
          cat > keystore.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtsn6-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtsn6-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtsn6-release-build-logs
          path: android/app/build/outputs/
          if-no-files-found: ignore
