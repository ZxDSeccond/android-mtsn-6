name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Locate Project Root & Install Dependencies
      run: |
        # Cari letak package.json secara otomatis di root atau subfolder
        if [ -f "package.json" ]; then
          echo "Found package.json in root"
        elif [ -f "android-mtsn-6/package.json" ]; then
          cd android-mtsn-6
          echo "Moved to android-mtsn-6"
        fi
        
        npm install --legacy-peer-deps
        npx cap init --yes --force || true

    - name: Add Android Platform & Sync
      run: |
        if [ -d "android-mtsn-6" ]; then
          cd android-mtsn-6
        fi
        
        npx cap add android || true
        npx cap sync android

    - name: Build Debug APK
      run: |
        if [ -d "android-mtsn-6" ]; then
          cd android-mtsn-6
        fi
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug-mtsn6
        path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
