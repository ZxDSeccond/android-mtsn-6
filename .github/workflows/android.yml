name: Build Android APK Pure Gradle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK manually
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME"

          cd "$RUNNER_TEMP"
          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip -d "$ANDROID_HOME"

          if [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            echo "SDK tools found at cmdline-tools/bin"
          elif [ -d "$ANDROID_HOME/cmdline-tools-latest/bin" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools-latest" "$ANDROID_HOME/cmdline-tools/latest"
          else
            echo "SDK structure not found"
            find "$ANDROID_HOME" -maxdepth 4 -type d | head -50
            exit 1
          fi

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
