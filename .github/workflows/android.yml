name: Build Android Release APK/AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with remote branch before push
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git fetch origin
          git pull --rebase origin "$CURRENT_BRANCH" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Commit generated changes if any
        run: |
          git add .
          git diff --cached --quiet || git commit -m "Update Android build artifacts"

      - name: Push changes to remote
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin HEAD:"$CURRENT_BRANCH"
