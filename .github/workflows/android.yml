name: Build Android APK Pure Gradle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy Web Files to Android Assets
      run: |
        # Buat otomatis folder assets Android dan salin file web kamu ke dalam APK
        mkdir -p android/app/src/main/assets/public
        
        # Cek apakah folder www ada, lalu salin isinya
        if [ -d "www" ]; then
          cp -r www/* android/app/src/main/assets/public/
        elif [ -d "android-mtsn-6/www" ]; then
          cp -r android-mtsn-6/www/* android/app/src/main/assets/public/
        fi

    - name: Build APK with Gradle
      run: |
        # Masuk ke folder android lalu build APK debug
        if [ -d "android" ]; then
          cd android
        elif [ -d "android-mtsn-6/android" ]; then
          cd android-mtsn-6/android
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug-mtsn6
        path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
