<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Absensi MTsN 6 Solok</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{
      --bg:#020817;
      --panel:#0f172a;
      --panel-soft:#111827;
      --line:#334155;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --green:#10b981;
      --green-2:#34d399;
      --cyan:#22d3ee;
      --shadow: rgba(15, 23, 42, .7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(16,185,129,0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34,211,238,0.12), transparent 35%),
        var(--bg);
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 14px 28px;
    }

    .header {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow: 0 12px 28px rgba(2,6,23,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #052e16;
      background: linear-gradient(135deg, #34d399, #22d3ee);
      box-shadow: 0 8px 20px rgba(52, 211, 153, 0.35);
    }

    .title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
    }

    .subtitle {
      margin: 2px 0 0 0;
      color: #34d399;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .status {
      border: 1px solid rgba(52, 211, 153, 0.3);
      background: rgba(16, 185, 129, 0.08);
      color: #a7f3d0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 8px;
      border-radius: 999px;
    }

    .tabs {
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      padding: 6px;
    }

    .tabs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .tab-btn {
      border: 0;
      outline: 0;
      background: transparent;
      color: #cbd5e1;
      padding: 12px 8px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: white;
      box-shadow: 0 10px 22px rgba(16, 185, 129, 0.25);
    }

    .panel {
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(2,6,23,0.3);
    }

    .hidden {
      display: none !important;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.7);
      color: #f8fafc;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    .input::placeholder {
      color: #64748b;
    }

    .input:focus {
      border-color: rgba(52, 211, 153, 0.8);
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.15);
    }

    .space-y > * + * { margin-top: 14px; }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: white;
      box-shadow: 0 12px 22px rgba(16,185,129,0.25);
    }

    .btn-secondary {
      background: rgba(51,65,85,0.85);
      color: white;
    }

    .scan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mini-btn {
      border: 0;
      background: rgba(71,85,105,0.8);
      color: #f8fafc;
      border-radius: 12px;
      padding: 9px 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 10px;
      cursor: pointer;
    }

    .scan-box {
      width: 100%;
      min-height: 220px;
      border-radius: 18px;
      overflow: hidden;
      background: #020817;
      border: 1px solid rgba(148,163,184,0.25);
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 18px;
      display: block;
      object-fit: cover;
      max-height: 420px;
    }

    .loading-box {
      display: none;
      text-align: center;
      padding: 20px 8px 8px;
    }

    .loading-box.show {
      display: block;
    }

    .spinner-core {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #34d399, #22d3ee);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.1s infinite ease-in-out;
    }

    .spinner-core::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #020817;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .result-box {
      display: none;
      margin-top: 16px;
      border-radius: 16px;
      background: rgba(16,185,129,.09);
      border: 1px solid rgba(52,211,153,.35);
      padding: 16px;
      text-align: center;
    }

    .result-box.show {
      display: block;
    }

    .result-title {
      color: #a7f3d0;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .result-text {
      margin-top: 10px;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.6;
    }

    .qr-wrap {
      margin-top: 18px;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.6);
      padding: 16px;
      text-align: center;
    }

    #qrcode {
      width: 200px;
      height: 200px;
      margin: 0 auto 14px;
      background: #fff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #64748b;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 9px;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo">M</div>
          <div>
            <p class="title">MTsN 6 Solok</p>
            <p class="subtitle">Sistem Absensi Digital</p>
          </div>
        </div>
        <span class="status">Online</span>
      </div>
    </header>

    <nav class="tabs">
      <div class="tabs-grid">
        <button class="tab-btn active" type="button" data-tab="scanner">Scanner</button>
        <button class="tab-btn" type="button" data-tab="generator">Daftar Siswa</button>
      </div>
    </nav>

    <main>
      <section id="view-scanner" class="panel">
        <div class="scan-header">
          <div style="color:#94a3b8;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;">
            Pindai Kehadiran
          </div>
          <div>
            <button type="button" class="mini-btn" id="btn-gallery">Galeri</button>
            <input type="file" id="file-input" accept="image/*" class="hidden" />
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="btn-start-camera">
          Buka Kamera QR
        </button>

        <div id="reader" class="scan-box hidden" aria-live="polite"></div>

        <div id="loading-scan" class="loading-box">
          <div class="spinner-core"></div>
          <div style="color:#34d399;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;">
            Menyinkronkan data
          </div>
        </div>

        <div id="result-box" class="result-box">
          <div class="result-title">Berhasil Tercatat</div>
          <div id="student-info" class="result-text"></div>
        </div>

        <button type="button" class="btn btn-secondary hidden" id="btn-rescan" style="margin-top:16px;">
          Scan Lagi
        </button>
      </section>

      <section id="view-generator" class="panel hidden">
        <div style="color:#94a3b8;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;">
          Registrasi Siswa
        </div>

        <div class="space-y">
          <div>
            <label class="label">ID / NISN</label>
            <input id="gen-id" class="input" type="text" placeholder="Contoh: M6-001" />
          </div>

          <div>
            <label class="label">Nama Lengkap</label>
            <input id="gen-nama" class="input" type="text" placeholder="Contoh: Zidan Ramadan" />
          </div>

          <div>
            <label class="label">Kelas</label>
            <input id="gen-kelas" class="input" type="text" placeholder="Contoh: IX-A" />
          </div>

          <div>
            <label class="label">No. WhatsApp Orang Tua</label>
            <input id="gen-hp" class="input" type="text" placeholder="Contoh: 6281234567890" />
          </div>

          <button type="button" class="btn btn-primary" id="btn-save">
            Simpan & Buat QR
          </button>
        </div>

        <div id="qrcode-wrap" class="qr-wrap hidden">
          <div id="qrcode"></div>
          <button type="button" class="btn btn-secondary" id="btn-download-qr">
            Download QR
          </button>
        </div>
      </section>
    </main>

    <div class="footer">© 2026 ZxD • MTsN 6 Solok</div>
  </div>

  <script>
    const SUPABASE_URL = "https://pkbgvpmkjadclogjmyxk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_o9l7GgAJK_UvVReROKT3Vg_6DGOf7D8";

    let html5QrCode = null;
    let generatedStudentId = "";

    function getSupabaseHeaders() {
      return {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      };
    }

    function setActiveTab(tabName) {
      const scannerSection = document.getElementById("view-scanner");
      const generatorSection = document.getElementById("view-generator");
      const buttons = document.querySelectorAll(".tab-btn");

      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });

      if (tabName === "scanner") {
        scannerSection.classList.remove("hidden");
        generatorSection.classList.add("hidden");
        stopScanner();
      } else {
        scannerSection.classList.add("hidden");
        generatorSection.classList.remove("hidden");
        stopScanner();
      }
    }

    function stopScanner() {
      if (!html5QrCode) return;

      html5QrCode.stop()
        .then(() => {
          try { html5QrCode.clear(); } catch (e) {}
        })
        .catch(() => {})
        .finally(() => {
          html5QrCode = null;
          const reader = document.getElementById("reader");
          if (reader) reader.classList.add("hidden");
        });
    }

    function showLoading(show) {
      const loading = document.getElementById("loading-scan");
      if (!loading) return;
      loading.classList.toggle("show", show);
    }

    function hideScanResult() {
      const resultBox = document.getElementById("result-box");
      if (resultBox) resultBox.classList.remove("show");
    }

    function startCameraFromUserAction() {
      hideScanResult();

      const reader = document.getElementById("reader");
      const btnRescan = document.getElementById("btn-rescan");

      if (reader) reader.classList.remove("hidden");
      if (btnRescan) btnRescan.classList.add("hidden");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Browser ini tidak mendukung akses kamera.");
        return;
      }

      if (html5QrCode) {
        html5QrCode.stop().catch(() => {}).finally(() => {
          startCameraInstance();
        });
        return;
      }

      startCameraInstance();
    }

    function startCameraInstance() {
      const reader = document.getElementById("reader");
      if (!reader) return;

      try {
        html5QrCode = new Html5Qrcode("reader");
      } catch (error) {
        alert("Camera tidak dapat diinisialisasi.");
        return;
      }

      const config = { fps: 10, qrbox: { width: 260, height: 260 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        () => {}
      ).catch(() => {
        html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess,
          () => {}
        ).catch(() => {
          alert("Kamera tidak bisa dibuka. Pastikan izin kamera sudah diberikan.");
          if (reader) reader.classList.add("hidden");
        });
      });
    }

    async function onScanSuccess(decodedText) {
      const studentId = String(decodedText).trim();
      if (!studentId) return;

      stopScanner();

      showLoading(true);

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/students?id=eq.${encodeURIComponent(studentId)}`,
          {
            method: "GET",
            headers: getSupabaseHeaders()
          }
        );

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          showLoading(false);
          alert("ID siswa tidak terdaftar di database.");
          return;
        }

        const student = data[0];
        const resultBox = document.getElementById("result-box");
        const studentInfo = document.getElementById("student-info");

        if (studentInfo) {
          studentInfo.innerHTML =
            `<strong>${student.name}</strong><br>` +
            `Kelas: ${student.class} • ID: ${student.id}<br>` +
            `<span style="color:#a7f3d0;font-weight:700;">Status: Hadir Terverifikasi</span>`;
        }

        if (resultBox) resultBox.classList.add("show");

        const btnRescan = document.getElementById("btn-rescan");
        if (btnRescan) btnRescan.classList.remove("hidden");

        await fetch(`${SUPABASE_URL}/rest/v1/attendance`, {
          method: "POST",
          headers: getSupabaseHeaders(),
          body: JSON.stringify({
            student_id: student.id,
            status: "present",
            scanned_at: new Date().toISOString()
          })
        });

        const message = `Assalamu'alaikum, memberitahukan bahwa ananda ${student.name} (${student.class}) telah hadir di MTsN 6 Solok hari ini. Terima kasih.`;
        const waUrl = `https://api.whatsapp.com/send?phone=${student.phone}&text=${encodeURIComponent(message)}`;

        setTimeout(() => {
          window.location.href = waUrl;
        }, 1200);

      } catch (error) {
        console.error(error);
        alert("Gagal memuat data dari server.");
      } finally {
        showLoading(false);
      }
    }

    async function registerAndGenerate() {
      const idSiswa = document.getElementById("gen-id").value.trim();
      const nama = document.getElementById("gen-nama").value.trim();
      const kelas = document.getElementById("gen-kelas").value.trim();
      const hp = document.getElementById("gen-hp").value.trim();

      if (!idSiswa || !nama || !kelas || !hp) {
        alert("Harap lengkapi seluruh data siswa.");
        return;
      }

      const btnSave = document.getElementById("btn-save");
      btnSave.disabled = true;
      btnSave.textContent = "Menyimpan...";

      const payload = {
        id: idSiswa,
        name: nama,
        class: kelas,
        phone: hp
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/students`, {
          method: "POST",
          headers: getSupabaseHeaders(),
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const text = await response.text();
          console.error(text);
          throw new Error("insert failed");
        }

        generatedStudentId = idSiswa;

        const qrElement = document.getElementById("qrcode");
        qrElement.innerHTML = "";

        new QRCode(qrElement, {
          text: idSiswa,
          width: 200,
          height: 200,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById("qrcode-wrap").classList.remove("hidden");
        setTimeout(() => {
          downloadQRCode(true);
        }, 250);

        alert("QR berhasil dibuat dan otomatis tersimpan. Silakan buka tab Scanner untuk memindai.");
      } catch (error) {
        console.error(error);
        alert("Gagal menyimpan data siswa.");
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = "Simpan & Buat QR";
      }
    }

    function downloadQRCode(auto = false) {
      const qrBox = document.getElementById("qrcode");
      if (!qrBox) return;

      const img = qrBox.querySelector("img") || qrBox.querySelector("canvas");
      if (!img) {
        if (!auto) alert("QR Code belum tersedia.");
        return;
      }

      const imageUrl = img.tagName === "CANVAS" ? img.toDataURL("image/png") : img.src;
      const a = document.createElement("a");
      a.href = imageUrl;
      a.download = `Kartu-QR-${generatedStudentId || "Siswa"}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleGalleryScan(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = document.getElementById("reader");
      if (reader) reader.classList.remove("hidden");

      const tempQr = new Html5Qrcode("reader");

      tempQr.scanFile(file, true)
        .then((decodedText) => {
          tempQr.clear();
          onScanSuccess(decodedText);
        })
        .catch(() => {
          alert("QR Code tidak ditemukan pada gambar yang dipilih.");
        })
        .finally(() => {
          event.target.value = "";
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.addEventListener("click", function () {
          setActiveTab(this.dataset.tab);
        });
      });

      document.getElementById("btn-start-camera").addEventListener("click", startCameraFromUserAction);
      document.getElementById("btn-rescan").addEventListener("click", startCameraFromUserAction);
      document.getElementById("btn-save").addEventListener("click", registerAndGenerate);
      document.getElementById("btn-download-qr").addEventListener("click", function () {
        downloadQRCode(false);
      });
      document.getElementById("btn-gallery").addEventListener("click", function () {
        document.getElementById("file-input").click();
      });
      document.getElementById("file-input").addEventListener("change", handleGalleryScan);
    });
  </script>
</body>
</html>
