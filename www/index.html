<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Cloud - MTsN 6 Solok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #reader video { width: 100% !important; height: auto !important; object-fit: cover; border-radius: 0.75rem; }
        @keyframes rgb-spin {
            0% { transform: rotate(0deg); filter: hue-rotate(0deg); }
            50% { transform: rotate(180deg); filter: hue-rotate(180deg); }
            100% { transform: rotate(360deg); filter: hue-rotate(360deg); }
        }
        .rgb-loader {
            animation: rgb-spin 1.5s linear infinite;
            background: linear-gradient(135deg, #10b981, #3b82f6, #ec4899, #8b5cf6, #10b981);
            background-size: 300% 300%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-slate-950 font-extrabold shadow-lg shadow-emerald-500/20">
                    ZX
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white tracking-wide">MTsN 6 SOLOK</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Sistem Absensi Terintegrasi</p>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 font-semibold px-2.5 py-1 rounded-full border border-emerald-500/20">
                Cloud Active
            </span>
        </div>
    </header>

    <!-- Tab Navigasi -->
    <div class="max-w-md w-full mx-auto px-4 mt-4">
        <div class="bg-slate-900 p-1 rounded-xl flex border border-slate-800 shadow-inner">
            <button onclick="switchTab('scanner')" id="tab-scanner-btn" class="flex-1 py-2.5 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow-md transition-all">
                Scan kehadiran
            </button>
            <button onclick="switchTab('generator')" id="tab-generator-btn" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                daftarkan siswa
            </button>
        </div>
    </div>

    <!-- Konten Utama -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center">
        
        <!-- View Scanner -->
        <div id="view-scanner" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Pindai Kartu Siswa</h2>
                <button onclick="initScanner()" class="text-xs text-emerald-400 font-semibold hover:text-emerald-300 transition-colors">
                    refresh kamera
                </button>
            </div>

            <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-800 bg-slate-950 mb-4"></div>

            <!-- Loading Modern RGB -->
            <div id="loading-scan" class="hidden flex flex-col items-center justify-center py-6 space-y-3">
                <div class="w-10 h-10 rounded-full rgb-loader p-0.5 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <div class="w-full h-full bg-slate-950 rounded-full"></div>
                </div>
                <p class="text-xs text-emerald-400 font-semibold animate-pulse tracking-wide">Menyelaraskan data cloud...</p>
            </div>

            <div id="result-container" class="hidden mt-3 p-4 bg-emerald-950/40 border border-emerald-500/30 rounded-xl text-center">
                <span class="inline-block text-emerald-400 font-bold text-sm mb-1">Absensi Berhasil Tercatat</span>
                <p id="student-info" class="text-xs text-slate-300 mb-3 font-medium leading-relaxed"></p>
                <div class="inline-flex items-center text-xs text-emerald-300 font-semibold bg-emerald-900/40 px-3 py-1.5 rounded-lg border border-emerald-500/20">
                    Mengarahkan ke WhatsApp Orang Tua.
                </div>
            </div>

            <button id="btn-rescan" onclick="location.reload()" class="hidden mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all">
                Pindai Siswa Lain
            </button>
        </div>

        <!-- View Generator & Pendaftaran Otomatis -->
        <div id="view-generator" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl hidden">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Registrasi Data Siswa Baru</h2>
            
            <div class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">ID / NISN Unik</label>
                    <input type="text" id="gen-id" placeholder="Contoh: M6-001" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Nama Lengkap Siswa</label>
                    <input type="text" id="gen-nama" placeholder="Contoh: Zidan Ramadan" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">Kelas</label>
                    <input type="text" id="gen-kelas" placeholder="Contoh: IX-A" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">No. WhatsApp Orang Tua</label>
                    <input type="text" id="gen-hp" placeholder="Contoh: 6281234567890" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <button onclick="registerAndGenerate()" id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-all mt-2">
                    Simpan Cloud & Buat QR
                </button>
            </div>

            <div id="qrcode-container" class="mt-5 flex flex-col items-center hidden pt-4 border-t border-slate-800">
                <div id="qrcode" class="p-3 bg-white rounded-2xl shadow-xl mb-3"></div>
                <a id="download-btn" class="w-full text-center bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-3 px-4 rounded-xl shadow cursor-pointer transition-colors">
                    Hasil QR (.PNG)
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-[11px] text-slate-500 border-t border-slate-800 mt-auto bg-slate-950">
        &copy; 2026 ZxD &bull; MTsN 6 Solok, Sumatera Barat
    </footer>

    <!-- Skrip Logika -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyqSpvgy4euPWjIW2f2OEwmxCCK7z_3s0ueYjaYzFkR41KqTHunA7PshcC2j-ZNYHZu/exec";[span_1](start_span)[span_1](end_span)

        function switchTab(tab) {
            const scannerView = document.getElementById('view-scanner');
            const generatorView = document.getElementById('view-generator');
            const scannerBtn = document.getElementById('tab-scanner-btn');
            const generatorBtn = document.getElementById('tab-generator-btn');

            if (tab === 'scanner') {
                scannerView.classList.remove('hidden');
                generatorView.classList.add('hidden');
                scannerBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow-md transition-all";
                generatorBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
                initScanner();
            } else {
                scannerView.classList.add('hidden');
                generatorView.classList.remove('hidden');
                generatorBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow-md transition-all";
                scannerBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
                if(html5QrCode) { html5QrCode.stop().catch(e => {}); }
            }
        }

        function registerAndGenerate() {
            let idSiswa = document.getElementById('gen-id').value.trim();
            let nama = document.getElementById('gen-nama').value.trim();
            let kelas = document.getElementById('gen-kelas').value.trim();
            let hp = document.getElementById('gen-hp').value.trim();

            if (!idSiswa || !nama || !kelas || !hp) {
                alert("Harap lengkapi seluruh data siswa");
                return;
            }

            let btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Menyimpan ke Cloud...";
            btnSave.disabled = true;

            let payload = {
                action: "register",
                id: idSiswa,
                name: nama,
                class: kelas,
                phone: hp
            };

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                btnSave.innerText = "Simpan Cloud & Buat QR";
                btnSave.disabled = false;
                alert("Data siswa berhasil tersimpan secara otomatis");

                let qrElement = document.getElementById('qrcode');
                qrElement.innerHTML = "";

                new QRCode(qrElement, {
                    text: idSiswa,
                    width: 200,
                    height: 200,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                document.getElementById('qrcode-container').classList.remove('hidden');

                setTimeout(() => {
                    let img = qrElement.querySelector('img') || qrElement.querySelector('canvas');
                    let downloadBtn = document.getElementById('download-btn');
                    if (img) {
                        downloadBtn.href = img.tagName === 'CANVAS' ? img.toDataURL("image/png") : img.src;
                        downloadBtn.download = `Kartu-QR-${idSiswa}.png`;
                    }
                }, 400);

            }).catch(err => {
                btnSave.innerText = "Simpan Cloud & Buat QR";
                btnSave.disabled = false;
                alert("Koneksi jaringan bermasalah");
            });
        }

        let html5QrCode = null;
        let isScanned = false;

        function initScanner() {
            isScanned = false;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("btn-rescan").classList.add("hidden");
            document.getElementById("loading-scan").classList.add("hidden");

            if (html5QrCode) {
                try { html5QrCode.stop(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 20, qrbox: { width: 240, height: 240 } }, 
                onScanSuccess, 
                () => {}
            ).catch(err => {
                console.log("Kamera error: ", err);
            });
        }

        function onScanSuccess(decodedText) {
            if (isScanned) return;
            isScanned = true;

            if (html5QrCode) {
                html5QrCode.stop().catch(err => {});
            }

            let scannedId = decodedText.trim();
            document.getElementById("loading-scan").classList.remove("hidden");

            fetch(`${API_URL}?id=${encodeURIComponent(scannedId)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("loading-scan").classList.add("hidden");

                    if (data && data.id) {
                        document.getElementById("student-info").innerHTML = `
                            <strong>${data.name}</strong><br>
                            Kelas: ${data.class} | ID: ${data.id}<br>
                            <span class="text-emerald-400 font-semibold">Status: Terverifikasi Hadir</span>
                        `;

                        let pesanWA = `Assalamu'alaikum, memberitahukan bahwa ananda ${data.name} (${data.class}) telah hadir di MTsN 6 Solok hari ini. Terima kasih.`;
                        let waUrl = `https://api.whatsapp.com/send?phone=${data.phone}&text=${encodeURIComponent(pesanWA)}`;

                        document.getElementById("result-container").classList.remove("hidden");
                        document.getElementById("btn-rescan").classList.remove("hidden");

                        setTimeout(() => {
                            window.location.href = waUrl;
                        }, 1200);

                    } else {
                        alert("ID Siswa tidak terdaftar di database cloud");
                        isScanned = false;
                        initScanner();
                    }
                })
                .catch(err => {
                    document.getElementById("loading-scan").classList.add("hidden");
                    alert("Gagal memuat data dari server");
                    isScanned = false;
                    initScanner();
                });
        }

        window.onload = () => {
            initScanner();
        };
    </script>
</body>
</html>
