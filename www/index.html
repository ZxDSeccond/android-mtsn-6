<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Absensi MTsN 6 Solok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #reader video { width: 100% !important; height: auto !important; object-fit: cover; border-radius: 1rem; }
    .scan-shell { min-height: 220px; }
    .bg-mesh {
      background:
        radial-gradient(circle at top, rgba(16,185,129,0.2), transparent 35%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.18), transparent 35%),
        #020817;
    }
    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-mesh text-slate-100 min-h-screen">
  <div class="mx-auto max-w-md min-h-screen px-4 pb-8 pt-4">
    <header class="glass sticky top-3 z-40 rounded-2xl border border-slate-700/60 shadow-xl shadow-slate-950/40">
      <div class="flex items-center justify-between px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 via-teal-400 to-cyan-500 text-lg font-black text-slate-950 shadow-lg shadow-emerald-500/30">M6</div>
          <div>
            <h1 class="text-[11px] font-bold uppercase tracking-[0.12em] text-white">MTsN 6 Solok</h1>
            <p class="text-[10px] text-emerald-400">Sistem Absensi Digital</p>
          </div>
        </div>
        <span class="rounded-full border border-emerald-400/30 bg-emerald-500/10 px-2 py-1 text-[9px] font-semibold uppercase tracking-[0.12em] text-emerald-300">Online</span>
      </div>
    </header>

    <nav class="mt-4 rounded-2xl border border-slate-700/60 bg-slate-900/80 p-1.5 shadow-lg shadow-slate-950/30">
      <div class="grid grid-cols-2 gap-1">
        <button id="tab-scanner-btn" class="tab-button active" type="button" onclick="switchTab('scanner')">Scanner</button>
        <button id="tab-generator-btn" class="tab-button" type="button" onclick="switchTab('generator')">Daftar Siswa</button>
      </div>
    </nav>

    <main class="mt-4 space-y-4">
      <section id="view-scanner" class="panel">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-[10px] font-bold uppercase tracking-[0.16em] text-slate-400">Pindai Kehadiran</h2>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="document.getElementById('file-input').click()" class="mini-button" type="button">Galeri</button>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="scanFromGallery(event)" />
          </div>
        </div>

        <button id="btn-start-camera" type="button" class="w-full rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 px-4 py-3 text-xs font-bold uppercase tracking-[0.12em] text-white shadow-lg shadow-emerald-500/20 transition hover:brightness-110">
          Buka Kamera QR
        </button>

        <div id="reader" class="scan-shell mt-4 hidden overflow-hidden rounded-2xl border border-slate-700 bg-slate-950"></div>

        <div id="loading-scan" class="hidden py-5 text-center">
          <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-violet-500 p-[2px] shadow-lg shadow-emerald-500/20">
            <div class="h-full w-full rounded-full bg-slate-950"></div>
          </div>
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-emerald-400 animate-pulse">Menyinkronkan data</p>
        </div>

        <div id="result-container" class="hidden mt-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4 text-center">
          <div class="text-sm font-bold text-emerald-300">Berhasil Tercatat</div>
          <p id="student-info" class="mt-2 text-xs leading-relaxed text-slate-200"></p>
          <div class="mt-3 inline-flex rounded-full border border-emerald-400/30 bg-emerald-500/10 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-emerald-300">Mengirim notifikasi</div>
        </div>

        <button id="btn-rescan" onclick="startCameraFromUserAction()" type="button" class="hidden mt-4 w-full rounded-xl bg-emerald-500 px-4 py-3 text-xs font-bold uppercase tracking-[0.12em] text-white shadow-lg shadow-emerald-500/20 transition hover:bg-emerald-400">Pindai Lagi</button>
      </section>

      <section id="view-generator" class="panel hidden">
        <div class="mb-4">
          <h2 class="text-[10px] font-bold uppercase tracking-[0.16em] text-slate-400">Registrasi Siswa</h2>
        </div>

        <div class="space-y-3.5">
          <label class="block">
            <span class="mb-1.5 block text-[11px] font-semibold text-slate-300">ID / NISN</span>
            <input id="gen-id" type="text" placeholder="Contoh: M6-001" class="input-field" />
          </label>

          <label class="block">
            <span class="mb-1.5 block text-[11px] font-semibold text-slate-300">Nama Lengkap</span>
            <input id="gen-nama" type="text" placeholder="Contoh: Zidan Ramadan" class="input-field" />
          </label>

          <label class="block">
            <span class="mb-1.5 block text-[11px] font-semibold text-slate-300">Kelas</span>
            <input id="gen-kelas" type="text" placeholder="Contoh: IX-A" class="input-field" />
          </label>

          <label class="block">
            <span class="mb-1.5 block text-[11px] font-semibold text-slate-300">No. WhatsApp Orang Tua</span>
            <input id="gen-hp" type="text" placeholder="Contoh: 6281234567890" class="input-field" />
          </label>

          <button id="btn-save" onclick="registerAndGenerate()" type="button" class="w-full rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 px-4 py-3 text-xs font-bold uppercase tracking-[0.12em] text-white shadow-lg shadow-emerald-500/20 transition hover:brightness-110">Simpan & Buat QR</button>
        </div>

        <div id="qrcode-container" class="mt-5 hidden rounded-2xl border border-slate-700 bg-slate-950/60 p-4 text-center">
          <div id="qrcode" class="mx-auto mb-3 flex w-[200px] items-center justify-center rounded-2xl bg-white p-3 shadow-xl"></div>
          <button onclick="downloadQRCode()" type="button" class="w-full rounded-xl bg-slate-800 px-4 py-3 text-xs font-bold uppercase tracking-[0.12em] text-slate-100 transition hover:bg-slate-700">Unduh QR</button>
        </div>
      </section>
    </main>

    <footer class="mt-6 pb-2 text-center text-[10px] uppercase tracking-[0.12em] text-slate-500">
      © 2026 ZxD • MTsN 6 Solok
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://pkbgvpmkjadclogjmyxk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_o9l7GgAJK_UvVReROKT3Vg_6DGOf7D8";

    function getSupabaseHeaders() {
      return {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      };
    }

    let html5QrCode = null;
    let generatedStudentId = '';

    function switchTab(tab) {
      const scannerView = document.getElementById('view-scanner');
      const generatorView = document.getElementById('view-generator');
      const scannerBtn = document.getElementById('tab-scanner-btn');
      const generatorBtn = document.getElementById('tab-generator-btn');

      if (tab === 'scanner') {
        scannerView.classList.remove('hidden');
        generatorView.classList.add('hidden');
        scannerBtn.classList.add('active');
        generatorBtn.classList.remove('active');
      } else {
        scannerView.classList.add('hidden');
        generatorView.classList.remove('hidden');
        generatorBtn.classList.add('active');
        scannerBtn.classList.remove('active');
        stopScanner();
      }
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
      const reader = document.getElementById('reader');
      if (reader) reader.classList.add('hidden');
    }

    function startCameraFromUserAction() {
      const reader = document.getElementById('reader');
      const loading = document.getElementById('loading-scan');
      const result = document.getElementById('result-container');
      const btnRescan = document.getElementById('btn-rescan');

      if (reader) reader.classList.remove('hidden');
      if (result) result.classList.add('hidden');
      if (btnRescan) btnRescan.classList.add('hidden');
      if (loading) loading.classList.add('hidden');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Browser HP ini tidak mendukung akses kamera.');
        return;
      }

      if (html5QrCode) {
        html5QrCode.stop().catch(() => {}).finally(() => {
          startCameraInstance();
        });
        return;
      }

      startCameraInstance();
    }

    document.getElementById('btn-start-camera').addEventListener('click', startCameraFromUserAction);

    function startCameraInstance() {
      html5QrCode = new Html5Qrcode('reader');
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess,
        () => {}
      ).catch(() => {
        html5QrCode.start(
          { facingMode: 'user' },
          config,
          onScanSuccess,
          () => {}
        ).catch(() => {
          alert('Kamera tidak bisa dibuka. Pastikan izin kamera sudah diizinkan dan coba lagi.');
          const reader = document.getElementById('reader');
          if (reader) reader.classList.add('hidden');
        });
      });
    }

    function scanFromGallery(event) {
      if (event.target.files.length === 0) return;
      const imageFile = event.target.files[0];
      const readerObj = new Html5Qrcode('reader');

      readerObj.scanFile(imageFile, true)
        .then(decodedText => {
          readerObj.clear();
          onScanSuccess(decodedText);
        })
        .catch(() => {
          alert('QR Code tidak ditemukan di gambar yang dipilih.');
        });
    }

    async function onScanSuccess(decodedText) {
      stopScanner();
      const studentId = decodedText.trim();
      const loading = document.getElementById('loading-scan');
      if (loading) loading.classList.remove('hidden');

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/students?id=eq.${encodeURIComponent(studentId)}`,
          {
            method: 'GET',
            headers: getSupabaseHeaders()
          }
        );

        const data = await response.json();

        if (loading) loading.classList.add('hidden');

        if (!data || data.length === 0) {
          alert('ID siswa tidak terdaftar di database.');
          return;
        }

        const student = data[0];
        const studentInfo = document.getElementById('student-info');
        if (studentInfo) {
          studentInfo.innerHTML = `
            <strong>${student.name}</strong><br>
            Kelas: ${student.class} • ID: ${student.id}<br>
            <span class="text-emerald-300 font-semibold">Status: Hadir Terverifikasi</span>
          `;
        }

        const result = document.getElementById('result-container');
        if (result) result.classList.remove('hidden');

        const btnRescan = document.getElementById('btn-rescan');
        if (btnRescan) btnRescan.classList.remove('hidden');

        await fetch(`${SUPABASE_URL}/rest/v1/attendance`, {
          method: 'POST',
          headers: getSupabaseHeaders(),
          body: JSON.stringify({
            student_id: student.id,
            status: 'present',
            scanned_at: new Date().toISOString()
          })
        });

        const message = `Assalamu'alaikum, memberitahukan bahwa ananda ${student.name} (${student.class}) telah hadir di MTsN 6 Solok hari ini. Terima kasih.`;
        const waUrl = `https://api.whatsapp.com/send?phone=${student.phone}&text=${encodeURIComponent(message)}`;

        setTimeout(() => {
          window.location.href = waUrl;
        }, 1200);
      } catch (error) {
        console.error(error);
        if (loading) loading.classList.add('hidden');
        alert('Gagal memuat data dari server.');
      }
    }

    async function registerAndGenerate() {
      const idSiswa = document.getElementById('gen-id').value.trim();
      const nama = document.getElementById('gen-nama').value.trim();
      const kelas = document.getElementById('gen-kelas').value.trim();
      const hp = document.getElementById('gen-hp').value.trim();

      if (!idSiswa || !nama || !kelas || !hp) {
        alert('Harap lengkapi seluruh data siswa.');
        return;
      }

      const btnSave = document.getElementById('btn-save');
      btnSave.innerText = 'Menyimpan...';
      btnSave.disabled = true;

      const payload = {
        id: idSiswa,
        name: nama,
        class: kelas,
        phone: hp
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/students`, {
          method: 'POST',
          headers: getSupabaseHeaders(),
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const text = await response.text();
          console.error(text);
          throw new Error('insert failed');
        }

        generatedStudentId = idSiswa;
        const qrElement = document.getElementById('qrcode');
        qrElement.innerHTML = '';

        new QRCode(qrElement, {
          text: idSiswa,
          width: 200,
          height: 200,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById('qrcode-container').classList.remove('hidden');
        setTimeout(() => {
          downloadQRCode({ auto: true });
        }, 300);

        alert('QR berhasil dibuat dan otomatis tersimpan. Buka tab Scanner bila siap untuk pindai.');
      } catch (error) {
        console.error(error);
        alert('Gagal menyimpan data siswa.');
      } finally {
        btnSave.innerText = 'Simpan & Buat QR';
        btnSave.disabled = false;
      }
    }

    function downloadQRCode(options = {}) {
      const { auto = false } = options;
      const qrEl = document.getElementById('qrcode');
      const img = qrEl.querySelector('img') || qrEl.querySelector('canvas');

      if (!img) {
        if (!auto) alert('QR Code belum tersedia.');
        return;
      }

      const imageUrl = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
      const link = document.createElement('a');
      link.href = imageUrl;
      link.download = `Kartu-QR-${generatedStudentId || 'Siswa'}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
