<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Cloud - MTsN 6 Solok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #reader video { width: 100% !important; height: auto !important; object-fit: cover; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-600/20">
                    M6
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-900 leading-tight">MTsN 6 Solok</h1>
                    <p class="text-[11px] text-emerald-600 font-medium">Cloud Database Active</p>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-50 text-emerald-700 font-semibold px-2.5 py-1 rounded-full border border-emerald-200/60">
                Online Sync
            </span>
        </div>
    </header>

    <!-- Tab Navigasi -->
    <div class="max-w-md w-full mx-auto px-4 mt-4">
        <div class="bg-slate-200/70 p-1 rounded-xl flex shadow-inner">
            <button onclick="switchTab('scanner')" id="tab-scanner-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all">
                📷 Scan Absen Asli
            </button>
            <button onclick="switchTab('generator')" id="tab-generator-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                🪪 Pendaftaran & QR
            </button>
        </div>
    </div>

    <!-- Konten Utama -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center">
        
        <!-- View Scanner -->
        <div id="view-scanner" class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Scanner Kehadiran Siswa</h2>
                <button onclick="initScanner()" class="text-xs text-emerald-600 font-semibold hover:underline">
                    Reset Kamera 🔄
                </button>
            </div>

            <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-200 bg-slate-900 mb-3"></div>

            <div id="loading-scan" class="hidden text-center py-2 text-xs text-emerald-600 font-medium animate-pulse">
                🔍 Memeriksa database cloud...
            </div>

            <div id="result-container" class="hidden mt-3 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
                <span class="inline-block text-emerald-700 font-bold text-sm mb-1">✨ Absensi Berhasil Tercatat!</span>
                <p id="student-info" class="text-xs text-slate-700 mb-3 font-medium"></p>
                <div class="inline-flex items-center text-xs text-emerald-600 font-semibold bg-white px-3 py-1.5 rounded-lg border border-emerald-200 shadow-sm">
                    Membuka WhatsApp Orang Tua... 🚀
                </div>
            </div>

            <button id="btn-rescan" onclick="location.reload()" class="hidden mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-4 rounded-xl shadow-md transition-all">
                Scan Siswa Lain
            </button>
        </div>

        <!-- View Generator & Pendaftaran Otomatis -->
        <div id="view-generator" class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm hidden">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Daftar & Cetak Kartu Siswa</h2>
            
            <div class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">ID / NISN Unik</label>
                    <input type="text" id="gen-id" placeholder="Contoh: M6-001" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">Nama Lengkap Siswa</label>
                    <input type="text" id="gen-nama" placeholder="Contoh: Zidan Ramadan" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">Kelas</label>
                    <input type="text" id="gen-kelas" placeholder="Contoh: IX-A" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5">No. WhatsApp Orang Tua</label>
                    <input type="text" id="gen-hp" placeholder="Contoh: 6281234567890" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="registerAndGenerate()" id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition-all mt-1">
                    Simpan ke Sheets & Buat QR 📱
                </button>
            </div>

            <div id="qrcode-container" class="mt-5 flex flex-col items-center hidden pt-4 border-t border-slate-100">
                <div id="qrcode" class="p-3 bg-white rounded-2xl border border-slate-200 shadow-sm mb-3"></div>
                <a id="download-btn" class="w-full text-center bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2.5 px-4 rounded-xl shadow cursor-pointer">
                    Download Kartu QR (.PNG) 📥
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-[11px] text-slate-400 border-t border-slate-200/60 mt-auto bg-white">
        &copy; 2026 ZxD ~ MTsN 6 Solok, Sumatera Barat &bull; Cloud Integration
    </footer>

    <!-- Skrip Logika Koneksi Cloud -->
    <script>
        // URL Web App Google Sheets kamu
        const API_URL = "https://script.google.com/macros/s/AKfycbwWFcQ0cWiu024WQLHestrNEoEN5zEZhXS4vWk60lL5DASc1gCbbI6htgnFyPvZg-LC/exec";

        function switchTab(tab) {
            const scannerView = document.getElementById('view-scanner');
            const generatorView = document.getElementById('view-generator');
            const scannerBtn = document.getElementById('tab-scanner-btn');
            const generatorBtn = document.getElementById('tab-generator-btn');

            if (tab === 'scanner') {
                scannerView.classList.remove('hidden');
                generatorView.classList.add('hidden');
                scannerBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all";
                generatorBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                initScanner();
            } else {
                scannerView.classList.add('hidden');
                generatorView.classList.remove('hidden');
                generatorBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all";
                scannerBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                if(html5QrCode) { html5QrCode.stop().catch(e => {}); }
            }
        }

        // Fungsi Daftar Otomatis ke Google Sheets & Generate QR
        function registerAndGenerate() {
            let idSiswa = document.getElementById('gen-id').value.trim();
            let nama = document.getElementById('gen-nama').value.trim();
            let kelas = document.getElementById('gen-kelas').value.trim();
            let hp = document.getElementById('gen-hp').value.trim();

            if (!idSiswa || !nama || !kelas || !hp) {
                alert("Harap lengkapi semua data siswa, ZxD!");
                return;
            }

            let btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Menyimpan ke Cloud...";
            btnSave.disabled = true;

            let payload = {
                action: "register",
                id: idSiswa,
                name: nama,
                class: kelas,
                phone: hp
            };

            // Kirim data otomatis ke Google Sheets via Fetch API
            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                btnSave.innerText = "Simpan ke Sheets & Buat QR 📱";
                btnSave.disabled = false;
                alert("Data siswa berhasil tersimpan otomatis di Google Sheets!");

                // Generate QR Code yang berisi ID unik saja (Aman & Ringan)
                let qrElement = document.getElementById('qrcode');
                qrElement.innerHTML = "";

                new QRCode(qrElement, {
                    text: idSiswa,
                    width: 200,
                    height: 200,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                document.getElementById('qrcode-container').classList.remove('hidden');

                setTimeout(() => {
                    let img = qrElement.querySelector('img') || qrElement.querySelector('canvas');
                    let downloadBtn = document.getElementById('download-btn');
                    if (img) {
                        downloadBtn.href = img.tagName === 'CANVAS' ? img.toDataURL("image/png") : img.src;
                        downloadBtn.download = `Kartu-QR-${idSiswa}.png`;
                    }
                }, 400);

            }).catch(err => {
                btnSave.innerText = "Simpan ke Sheets & Buat QR 📱";
                btnSave.disabled = false;
                alert("Gagal terhubung ke database cloud. Periksa koneksi internet!");
            });
        }

        let html5QrCode = null;
        let isScanned = false;

        function initScanner() {
            isScanned = false;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("btn-rescan").classList.add("hidden");

            if (html5QrCode) {
                try { html5QrCode.stop(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 20, qrbox: { width: 240, height: 240 } }, 
                onScanSuccess, 
                () => {}
            ).catch(err => {
                console.log("Kamera error: ", err);
            });
        }

        // Fungsi Saat QR Code Siswa Discan Kamera
        function onScanSuccess(decodedText) {
            if (isScanned) return;
            isScanned = true;

            if (html5QrCode) {
                html5QrCode.stop().catch(err => {});
            }

            let scannedId = decodedText.trim();
            document.getElementById("loading-scan").classList.remove("hidden");

            // Ambil data asli langsung dari Google Sheets berdasarkan ID yang diskan
            fetch(`${API_URL}?id=${scannedId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("loading-scan").classList.add("hidden");

                    if (data && data.id) {
                        document.getElementById("student-info").innerHTML = `
                            <strong>${data.name}</strong><br>
                            Kelas: ${data.class} | ID: ${data.id}<br>
                            <span class="text-emerald-600 font-semibold">Status: Hadir Terverifikasi</span>
                        `;

                        let pesanWA = `Assalamu'alaikum, memberitahukan bahwa ananda ${data.name} (${data.class}) telah hadir di MTsN 6 Solok hari ini. Terima kasih.`;
                        let waUrl = `https://api.whatsapp.com/send?phone=${data.phone}&text=${encodeURIComponent(pesanWA)}`;

                        document.getElementById("result-container").classList.remove("hidden");
                        document.getElementById("btn-rescan").classList.remove("hidden");

                        setTimeout(() => {
                            window.location.href = waUrl;
                        }, 1200);

                    } else {
                        alert("ID Siswa tidak ditemukan di database Google Sheets!");
                        isScanned = false;
                        initScanner();
                    }
                })
                .catch(err => {
                    document.getElementById("loading-scan").classList.add("hidden");
                    alert("Gagal memuat data dari cloud database!");
                    isScanned = false;
                    initScanner();
                });
        }

        window.onload = () => {
            initScanner();
        };
    </script>
</body>
</html>
